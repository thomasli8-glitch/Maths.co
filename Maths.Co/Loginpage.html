<!DOCTYPE html>
<html>
<head>
    <title>Maths.Co/Loginpage</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

    <table width="100%" border="0">
        <tr>
            <td align="left"><a href="nologinhomepage.html" style="color: black; text-decoration: none;"><strong>Maths.Co</strong></a></td>
            <td align="right"><a href="nologinhomepage.html" style="color: black; text-decoration: none;">Homepage</a></td>
        </tr>
    </table>

    <br><br><br>
    <center>
        <form action="login.php" method="POST" style="width: 300px;">
            <div style="background-color: #eeeeee; padding: 30px; border-radius: 25px; text-align: left;">
                
                <label>username</label>
                <br>
                <input type="text" id="username" name="username" style="width: 100%; height: 35px; border: none; margin-top: 5px; margin-bottom: 20px;">
                
                <label>password</label>
                <br>
                <input type="password" id="password" name="password" style="width: 100%; height: 35px; border: none; margin-top: 5px;">
            </div>
            <div style="text-align: right; margin-top: 15px;">
                <input type="button" onclick="check()" value="OK" style="background-color: #dddddd; border: none; padding: 10px 30px; border-radius: 20px; cursor: pointer;">
            </div>

        </form>
    </center>
<script>
    function check() {
        if (document.getElementById("password").value == "Admin" && document.getElementById("username").value == "Admin") {
            window.location.href = "Homepage.html";
        }
        else{
            alert("incorrect username or password")
        }
    }
</script>
</body>
</html>
